<footer class="border-t border-border py-8 bg-background">
  <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <img
        src="https://speakfona.com/logo.png"
        alt="Fona"
        class="w-5 h-5 object-contain opacity-60"
      />
      <span class="text-xs text-muted-foreground"> © {{ currentYear }} Fona. All rights reserved. </span>
    </div>
    <div class="flex items-center gap-5">
      <a
        [routerLink]="appRoutesHelper.getPrivacyRoute()"
        class="text-xs text-muted-foreground hover:text-foreground cursor-pointer transition-colors no-underline"
      >
        Privacy
      </a>
      <a
        [routerLink]="appRoutesHelper.getTermsRoute()"
        class="text-xs text-muted-foreground hover:text-foreground cursor-pointer transition-colors no-underline"
      >
        Terms
      </a>
      <a
        [routerLink]="appRoutesHelper.getContactRoute()"
        class="text-xs text-muted-foreground hover:text-foreground cursor-pointer transition-colors no-underline"
      >
        Contact
      </a>
    </div>
  </div>
</footer>
