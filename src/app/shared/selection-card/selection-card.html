@if (isLoading()) {
<hlm-card size="sm"
  class="text-left group relative overflow-hidden w-full h-full flex flex-col justify-start pointer-events-none select-none">
  <hlm-card-header class="pb-2 flex flex-col gap-2">
    <div class="w-8 h-8 rounded-md">
      <hlm-skeleton class="w-full h-full" />
    </div>
    <hlm-skeleton class="w-24 h-4" />
    <hlm-skeleton class="w-16 h-3" />
  </hlm-card-header>
  <hlm-card-footer class="mt-auto pt-2">
    <hlm-skeleton class="w-28 h-3" />
  </hlm-card-footer>
</hlm-card>
} @else {
<hlm-card size="sm" (click)="select.emit()"
  class="text-left hover:border-primary/40 hover:bg-secondary group relative overflow-hidden cursor-pointer w-full h-full flex flex-col justify-start"
  [style.opacity]="unlocked() ? 1 : 0.8">
  <hlm-card-header class="pb-2">
    <div class="text-3xl mb-2">{{ flag() }}</div>
    <h3 hlmCardTitle class="text-foreground font-semibold text-sm" style="font-family: 'Plus Jakarta Sans', sans-serif">
      {{ title() }}
    </h3>
    <p hlmCardDescription class="text-muted-foreground text-xs mt-0.5" style="font-family: 'Inter', sans-serif">
      {{ subtitle() }}
    </p>
  </hlm-card-header>
  <hlm-card-footer class="mt-auto pt-2">
    @if (footerText()) {
    <div class="text-xs flex items-center gap-1" style="font-family: 'Inter', sans-serif; color: #6b7385">
      {{ footerText() }}
    </div>
    } @else {
    @if (unlocked()) {
    <div class="flex items-center gap-1 text-xs px-2 py-1 rounded-full"
      style="background-color: #4badc814; color: #4badc8; font-family: 'Inter', sans-serif">
      <ng-icon hlm name="lucideCheckCircle" size="11px" />
      Owned
    </div>
    } @else {
    <div class="flex items-center gap-1 text-xs px-2 py-1 rounded-full border border-border"
      style="color: #6b7385; font-family: 'Inter', sans-serif">
      <ng-icon hlm name="lucideLock" size="11px" />
      Pro
    </div>
    }
    }
  </hlm-card-footer>
</hlm-card>
}
