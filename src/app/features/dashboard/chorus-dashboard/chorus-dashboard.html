<app-sentence-text
  [language]="language()"
  [accent]="accent()"
  [sentenceId]="sentenceId()"
></app-sentence-text>
<p>ChorusCount: {{ chorusCount() }}</p>
<button matMiniFab (click)="previousSentence()" [disabled]="disablePreviousButton()">
  <mat-icon>skip_previous</mat-icon>
</button>
<button matMiniFab (click)="nextSentence()" [disabled]="disableNextButton()">
  <mat-icon>skip_next</mat-icon>
</button>

<app-audio-player
  [language]="language()"
  [accent]="accent()"
  [sentenceId]="sentenceId()"
></app-audio-player>
