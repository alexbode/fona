<div class="card-container">
  <mat-card>
    <mat-card-header>
      <app-sentence-text
        [language]="language()"
        [accent]="accent()"
        [sentenceId]="sentenceId()"
      ></app-sentence-text>
    </mat-card-header>
    <mat-card-content>
      <div class="chorus-count-row">
        <div class="chorus-count-col">
          @if (chorusCountResource.isLoading()) {
            <p>ChorusCount: -</p>
          } @else if (chorusCountResource.hasValue()) {
            <p>ChorusCount: {{ chorusCountResource.value() }}</p>
          } @else if (chorusCountResource.error()) {
            <p>ChorusCount: ?</p>
          }
          <p>SessionCount: {{sessionCount()}}</p>
        </div>
        <button matFab extended (click)="resetSessionCount()">
          Refresh
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <button matFab extended (click)="previousSentence()" [disabled]="disablePreviousButton()">
        <mat-icon>skip_previous</mat-icon>
        Prev Sentence
      </button>

      <button matFab extended (click)="nextSentence()" [disabled]="disableNextButton()">
        Next Sentence
        <mat-icon>skip_next</mat-icon>
      </button>
      <app-audio-player
        [language]="language()"
        [accent]="accent()"
        [sentenceId]="sentenceId()"
      ></app-audio-player>
    </mat-card-content>
  </mat-card>
</div>
