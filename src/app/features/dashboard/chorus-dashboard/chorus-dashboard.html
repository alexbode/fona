<div class="card-container">
  <mat-card>
    <mat-card-header>
      <app-sentence-text
        [language]="language()"
        [accent]="accent()"
        [sentenceId]="sentenceId()"
      ></app-sentence-text>
    </mat-card-header>
    <mat-card-content>
      @if (chorusCountResource.isLoading()) {
        <p>ChorusCount: -</p>
      }
      @if (chorusCountResource.hasValue()) {
        <p>ChorusCount: {{ chorusCountResource.value() }}</p>
      }
      @if (chorusCountResource.error()) {
        <p>ChorusCount: ?</p>
      }
      <button matFab extended (click)="previousSentence()" [disabled]="disablePreviousButton()">
        <mat-icon>skip_previous</mat-icon>
        Prev Sentence
      </button>

      <app-audio-player
        [language]="language()"
        [accent]="accent()"
        [sentenceId]="sentenceId()"
      ></app-audio-player>
      <button matFab extended (click)="nextSentence()" [disabled]="disableNextButton()">
        Next Sentence
        <mat-icon>skip_next</mat-icon>
      </button>
    </mat-card-content>
  </mat-card>
</div>
