<mat-card class="card-container">
  <app-sentence-text
    [language]="language()"
    [accent]="accent()"
    [sentenceId]="sentenceId()"
  ></app-sentence-text>
  <p>ChorusCount: {{ chorusCount() ?? '-' }}</p>
  <div>
    <button matFab extended (click)="previousSentence()" [disabled]="disablePreviousButton()">
      <mat-icon>skip_previous</mat-icon>
      Prev Sentence
    </button>
    <button matFab extended (click)="nextSentence()" [disabled]="disableNextButton()">
      Next Sentence
      <mat-icon>skip_next</mat-icon>
    </button>
  </div>

  <app-audio-player
    [language]="language()"
    [accent]="accent()"
    [sentenceId]="sentenceId()"
  ></app-audio-player>
</mat-card>
