<button mat-raised-button (click)="playAudio()">Play Audio</button>
<button mat-raised-button (click)="stopAudio()">Stop Audio</button>
<p>{{ isPlaying() }}</p>
<mat-button-toggle-group
  name="playBackSpeed"
  aria-label="Play Back Speed"
  [(ngModel)]="playbackSpeed"
>
  <mat-button-toggle value="25">25%</mat-button-toggle>
  <mat-button-toggle value="50">50%</mat-button-toggle>
  <mat-button-toggle value="75">75%</mat-button-toggle>
  <mat-button-toggle value="90">90%</mat-button-toggle>
  <mat-button-toggle value="100">100%</mat-button-toggle>
  <mat-button-toggle value="110">110%</mat-button-toggle>
</mat-button-toggle-group>
