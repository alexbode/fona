<div class="flex flex-col flex-1 h-full">
  <!-- Navigation Header / NavBar -->
  <header class="flex items-center gap-3 px-5 py-4 shrink-0">
    <button
      (click)="onBack()"
      class="flex items-center justify-center p-1 rounded-full hover:bg-secondary transition-colors cursor-pointer"
      aria-label="Back"
    >
      <ng-icon hlm name="lucideChevronLeft" size="20px" class="text-foreground" />
    </button>
    <span
      class="text-sm font-medium text-muted-foreground"
      style="font-family: 'Inter', sans-serif"
    >
      {{ language()?.name | titlecase }} · {{ accent()?.nativeName | titlecase }}
    </span>
  </header>

  <!-- Title Section -->
  <div class="px-5 pb-3 shrink-0">
    <h2
      class="text-2xl font-bold text-foreground"
      style="font-family: 'Plus Jakarta Sans', sans-serif"
    >
      What do you want to train?
    </h2>
  </div>

  <!-- Selection Options -->
  <div class="flex-1 overflow-y-auto px-5 pb-8 space-y-4 pt-2">
    <!-- Chorusing Option -->
    <button
      (click)="onSelectChorusing()"
      class="w-full bg-card border border-border rounded p-6 text-left hover:border-primary/40 transition-all active:scale-95 group cursor-pointer"
    >
      <div class="flex items-start gap-4">
        <div
          class="w-10 h-10 rounded flex items-center justify-center shrink-0"
          style="background-color: #4badc81a"
        >
          <ng-icon hlm name="lucideMic" size="18px" style="color: #4badc8" />
        </div>
        <div>
          <div
            class="text-foreground font-bold text-lg"
            style="font-family: 'Plus Jakarta Sans', sans-serif"
          >
            Chorusing
          </div>
          <p
            class="text-muted-foreground text-sm mt-1 leading-relaxed"
            style="font-family: 'Inter', sans-serif"
          >
            Listen to a native speaker and repeat simultaneously. Build muscle memory through
            repetition.
          </p>
          <div
            class="text-primary text-xs mt-3 tracking-widest uppercase font-medium"
            style="font-family: 'Inter', sans-serif; color: #4badc8"
          >
            Rep counting — rhythm training
          </div>
        </div>
      </div>
    </button>

    <!-- Minimal Pairs Option -->
    <button
      (click)="onSelectMinimalPairs()"
      class="w-full bg-card border border-border rounded p-6 text-left hover:border-accent/40 transition-all active:scale-95 group cursor-pointer"
    >
      <div class="flex items-start gap-4">
        <div
          class="w-10 h-10 rounded flex items-center justify-center shrink-0"
          style="background-color: #f871711a"
        >
          <ng-icon hlm name="lucideVolume2" size="18px" style="color: #f87171" />
        </div>
        <div>
          <div
            class="text-foreground font-bold text-lg"
            style="font-family: 'Plus Jakarta Sans', sans-serif"
          >
            Minimal Pairs
          </div>
          <p
            class="text-muted-foreground text-sm mt-1 leading-relaxed"
            style="font-family: 'Inter', sans-serif"
          >
            Hear two nearly identical sounds. Train your ear to distinguish them — the foundation of
            accent perception.
          </p>
          <div
            class="text-xs mt-3 tracking-widest uppercase font-medium"
            style="font-family: 'Inter', sans-serif; color: #f87171"
          >
            Ear training — phoneme discrimination
          </div>
        </div>
      </div>
    </button>
  </div>
</div>
