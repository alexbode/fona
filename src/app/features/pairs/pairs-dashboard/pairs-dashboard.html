<mat-card class="max-w-4xl place-content-center">
  <mat-card-header>
    <mat-card-title>{{ title() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="grid grid-cols-2">
      <app-pair-word [wordKey]="wordAKey()" class="col-span-1"></app-pair-word>
      <app-pair-word [wordKey]="wordBKey()" class="col-span-1"></app-pair-word>
      <app-pair-sentence [sentenceKey]="sentence()" class="col-span-2"></app-pair-sentence>
    </div>
  </mat-card-content>
  <mat-card-actions class="flex">
    <button matButton class="flex-1">Previous Example</button>
    <button matButton class="flex-1">Next Example</button>
  </mat-card-actions>
</mat-card>
