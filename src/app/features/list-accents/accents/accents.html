<div class="flex flex-col flex-1 h-full">
    <!-- Navigation Header / NavBar -->
    <header class="flex items-center gap-3 px-5 py-4 shrink-0">
        <button (click)="onBack()"
            class="flex items-center justify-center p-1 rounded-full hover:bg-secondary transition-colors cursor-pointer"
            aria-label="Back">
            <ng-icon hlm name="lucideChevronLeft" size="20px" class="text-foreground" />
        </button>
        <span class="text-sm font-medium text-muted-foreground" style="font-family: 'Inter', sans-serif">
            {{ language()?.name }}
        </span>
    </header>

    <!-- Title Section -->
    <div class="px-5 pb-3 shrink-0">
        <h2 class="text-2xl font-bold text-foreground" style="font-family: 'Plus Jakarta Sans', sans-serif">
            Choose an accent
        </h2>
    </div>

    <!-- Accents List -->
    <div class="flex-1 overflow-y-auto px-5 pb-8">
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
            @if (languages().isLoading) {
            @for (i of [1, 2, 3, 4, 5]; track i) {
            <app-selection-card [isLoading]="true" />
            }
            } @else if (language()) {
            @for (accent of language()?.accents; track accent.id) {
            <app-selection-card [flag]="accent.flag" [title]="accent.name | titlecase" [subtitle]="accent.nativeName | titlecase"
                [unlocked]="purchasedAccents.has(accent.name)" (select)="onSelect(accent)" />
            }
            } @else {
            <p class="col-span-full text-center py-8 text-muted-foreground text-sm"
                style="font-family: 'Inter', sans-serif">
                Failed to load accents.
            </p>
            }
        </div>
    </div>
</div>
