<div hlmSidebarWrapper>
  <hlm-sidebar>
    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Application</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of _items; track item.title) {
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton>
                <ng-icon hlm [name]="item.icon" />
                <span>{{ item.title }}</span>
              </a>
            </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </hlm-sidebar>
  <main hlmSidebarInset>
    <header
      class="sticky top-0 z-50 flex h-12 items-center justify-between border-b border-border bg-background/85 px-4 backdrop-blur-md">
      <button hlmSidebarTrigger><span class="sr-only"></span></button>
      <img src="https://speakfona.com/logo.png" alt="fona" class="h-8 w-8 object-contain" />
      <!-- <span class="font-bold">fona</span> -->
    </header>
    <ng-content />
  </main>
</div>
