@if (!isCurrentPathPartOfAuthFlow()) {
  <mat-toolbar color="primary">
    <!-- <mat-icon>menu</mat-icon> -->
    <img src="favicon-32x32.png" alt="Company Logo" class="navbar-logo" />
    <span>Repeat With Me</span>
    <span class="navbar-spacer"></span>
    @if (isLoggedIn()) {
      <button matButton="tonal" class="navbar-button">
        <mat-icon>settings</mat-icon>
        Settings
      </button>
      <a href="{{ appRoutesHelper.urlPaths.Home }}" (click)="logOut()">
        <button matButton="tonal" class="navbar-button" (click)="logOut()">
          <mat-icon>person</mat-icon>
          Log Out
        </button>
      </a>
    } @else {
      <a href="{{ appRoutesHelper.urlPaths.Signin }}">
        <button matButton="tonal" class="navbar-button">
          <mat-icon>person</mat-icon>
          Log In
        </button>
      </a>
      <a href="{{ appRoutesHelper.urlPaths.Signup }}">
        <button matButton="filled" class="navbar-button">Sign Up</button>
      </a>
    }
    <span>Logged in: {{ isLoggedIn() }}</span>
  </mat-toolbar>
}
